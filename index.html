<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produksi Mesin Twisting dan Konversi</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1d2433;--mut:#667085;--bd:#d9dee7;--ac:#1f5fa8;--acf:#fff;--err:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--fg:#e6e9ef;--mut:#98a2b3;--bd:#2e3745;--ac:#5aa0ec;--acf:#0c1220;--err:#ff8a7a}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--fg:#e6e9ef;--mut:#98a2b3;--bd:#2e3745;--ac:#5aa0ec;--acf:#0c1220;--err:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:1.2rem;margin:4px 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button{flex:1 0 auto;padding:10px 14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
section{display:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
section.on{display:block}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.row{display:flex;gap:8px;align-items:flex-end}.row>label{flex:1;margin:10px 0 0}
button.pri,button.sec,.sw{padding:11px 16px;border-radius:10px;font:inherit;cursor:pointer;border:1px solid var(--ac)}
button.pri{background:var(--ac);color:var(--acf);font-weight:600}
button.sec,.sw{background:transparent;color:var(--ac)}
.btns{display:flex;gap:8px;margin-top:14px}
.eq{font-size:.9rem;color:var(--ac);font-style:italic;margin:6px 0 0}
.out{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.err{color:var(--err)}
.big{font-weight:700;font-size:1.05rem;margin:14px 0 8px;color:var(--ac);word-break:break-word}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}td:nth-child(2),th:nth-child(2){text-align:right}
td small{color:var(--mut)}
.note{font-size:.8rem;color:var(--mut);margin-top:12px}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Produksi Mesin Twisting dan Konversi</h1>
<nav id="tabs"></nav>
<section id="p0"></section><section id="p1"></section><section id="p2"></section><section id="p3"></section>
</main>
<script>
const GL=453.59237, MY=0.9144;
const $=(s,r=document)=>r.querySelector(s);
function num(t){t=String(t).trim().replace("%","").replace(",",".");if(!t)return NaN;return Number(t)}
function fmt(x,d=6){
  if(x===0)return "0";
  let s;
  if(Math.abs(x)>=1e9||Math.abs(x)<1e-4){
    let [m,e]=x.toExponential(d-1).split("e");
    if(m.includes("."))m=m.replace(/0+$/,"").replace(/\.$/,"");
    s=m+"e"+e;
  }else{
    s=x.toPrecision(d);
    if(s.includes("e"))s=x.toFixed(d);
    if(s.includes("."))s=s.replace(/0+$/,"").replace(/\.$/,"");
  }
  return s.replace(".",",");
}

const SIS={
  "Ne₁":{lbl:"Ne₁ benang gintir [hank/lbs]",eq:"Produksi = (n × 453,6) / (TPM × 768 × Ne₁)",f:(n,t,x)=>n*453.6/(t*768*x)},
  "Nm":{lbl:"Nm benang gintir [meter/gram]",eq:"Produksi = n / (TPM × Nm)",f:(n,t,x)=>n/(t*x)},
  "Denier":{lbl:"Denier benang gintir [gram/9000 m]",eq:"Produksi = (n × Denier) / (TPM × 9000)",f:(n,t,x)=>n*x/(t*9000)},
  "Tex":{lbl:"Tex benang gintir [gram/1000 m]",eq:"Produksi = (n × Tex) / (TPM × 1000)",f:(n,t,x)=>n*x/(t*1000)}
};
(function(){
  const r=$("#p0");
  r.innerHTML=`<label>Sistem nomor benang<select id="sis">${Object.keys(SIS).map(k=>`<option>${k}</option>`).join("")}</select></label>
  <div class="eq" id="eq"></div>
  <label>n spindle [putaran/menit]<input id="n" inputmode="decimal"></label>
  <label>TPM [antihan/meter]<input id="tpm" inputmode="decimal"></label>
  <label id="lx"></label><input id="x" inputmode="decimal" style="margin-top:-2px">
  <label>Efisiensi mesin [%]<input id="eff" inputmode="decimal" value="100"></label>
  <label>Jumlah spindle<input id="j" inputmode="numeric" value="1"></label>
  <div class="btns"><button class="pri" id="go">Hitung</button><button class="sec" id="rs">Reset</button></div>
  <div class="out" id="res">Isi data lalu ketuk Hitung.</div>
  <p class="note">Nomor benang pada rumus adalah nomor benang gintir (mis. Ne 20/2 → Ne₁ = 10). Efisiensi 100% = produksi teoritis.</p>`;
  const sw=()=>{const s=SIS[$("#sis").value];$("#lx").textContent=s.lbl;$("#eq").textContent=s.eq;$("#x").value="";$("#res").textContent="Isi data lalu ketuk Hitung."};
  const bad=m=>{$("#res").innerHTML=`<span class="err">⚠ ${m}</span>`};
  function hitung(){
    const n=num($("#n").value),t=num($("#tpm").value),x=num($("#x").value),e=num($("#eff").value||"100"),j=num($("#j").value||"1");
    if(!(n>0))return bad("n spindle harus berupa angka lebih dari 0.");
    if(!(t>0))return bad("TPM harus berupa angka lebih dari 0.");
    if(!(x>0))return bad("Nomor benang harus berupa angka lebih dari 0.");
    if(!(e>0&&e<=100))return bad("Efisiensi harus lebih dari 0 dan maksimal 100.");
    if(!(j>=1&&Number.isInteger(j)))return bad("Jumlah spindle harus bilangan bulat (minimal 1).");
    const th=SIS[$("#sis").value].f(n,t,x),ak=th*e/100;
    const row=(a,b)=>`<tr><td>${a}</td><td>${fmt(b,5)} g/menit<br><small>${fmt(b*0.06,5)} kg/jam</small></td></tr>`;
    let h=`<b>Per spindle</b><table>${row("Teoritis (100%)",th)}${row("Aktual ("+fmt(e,4)+"%)",ak)}</table>`;
    if(j>1)h+=`<br><b>Total ${j} spindle</b><table>${row("Teoritis (100%)",th*j)}${row("Aktual ("+fmt(e,4)+"%)",ak*j)}</table>`;
    if(e<100)h+=`<p class="note">Produksi hilang: ${fmt((th-ak)*j*0.06,5)} kg/jam</p>`;
    $("#res").innerHTML=h;
  }
  $("#sis").onchange=sw;$("#go").onclick=hitung;
  $("#rs").onclick=()=>{["n","tpm","x"].forEach(i=>$("#"+i).value="");$("#eff").value="100";$("#j").value="1";$("#res").textContent="Isi data lalu ketuk Hitung."};
  r.addEventListener("keydown",e=>{if(e.key==="Enter")hitung()});
  sw();
})();

/* ---------- Konversi generik ---------- */
function konv(root,title,names,fn,notes){
  root.innerHTML=`<b>${title}</b><label>Nilai<input class="v" inputmode="decimal" value="1"></label>
  <div class="row"><label>Dari<select class="a"></select></label><button class="sw" title="Tukar">⇄</button><label>Ke<select class="b"></select></label></div>
  <div class="big"></div><table></table>`;
  const a=$(".a",root),b=$(".b",root),v=$(".v",root),big=$(".big",root),tb=$("table",root);
  [a,b].forEach(s=>names.forEach(n=>s.add(new Option(n,n))));b.selectedIndex=1;
  function up(){
    const x=num(v.value);tb.innerHTML="";
    if(!(x>0)){big.innerHTML='<span class="err">⚠ Nilai harus berupa angka lebih dari 0.</span>';return}
    big.textContent=`${fmt(x)} ${a.value} = ${fmt(fn(x,a.value,b.value))} ${b.value}`;
    tb.innerHTML=names.map(n=>`<tr><td>${n}${notes&&notes[n]?` <small>${notes[n]}</small>`:""}</td><td>${fmt(fn(x,a.value,n))}</td></tr>`).join("");
  }
  [v,a,b].forEach(e=>e.addEventListener("input",up));
  $(".sw",root).onclick=()=>{const t=a.value;a.value=b.value;b.value=t;up()};
  up();
}

/* Nomor benang (basis Tex) */
const NB={
  "Tex":[1,1,"g/1000 m"],"Dtex":[1,.1,"g/10.000 m"],"Denier":[1,1/9,"g/9000 m"],
  "Ne (katun)":[0,1000*GL/(840*MY),"hank 840 yd/lbs"],"Nm (metrik)":[0,1000,"m/g"],
  "Nw (worsted)":[0,1000*GL/(560*MY),"hank 560 yd/lbs"],"Nel (linen)":[0,1000*GL/(300*MY),"lea 300 yd/lbs"]
};
const toTex=(v,s)=>NB[s][0]?NB[s][1]*v:NB[s][1]/v, fromTex=(t,s)=>NB[s][0]?t/NB[s][1]:NB[s][1]/t;
const notesNB={};Object.keys(NB).forEach(k=>notesNB[k]=NB[k][2]);
const PJ={"Milimeter (mm)":.001,"Sentimeter (cm)":.01,"Meter (m)":1,"Kilometer (km)":1000,"Inci (inch)":.0254,"Kaki (foot)":.3048,"Yard (yd)":MY,"Mil (mile)":1609.344,
  "Hank katun (840 yd)":840*MY,"Hank worsted (560 yd)":560*MY,"Lea linen (300 yd)":300*MY,"Lea/skein katun (120 yd)":120*MY};
const BR={"Miligram (mg)":.001,"Gram (g)":1,"Kilogram (kg)":1000,"Ton metrik (t)":1e6,"Ons (oz)":GL/16,"Pound (lbs)":GL,"Grain (gr)":GL/7000,"Stone (st)":GL*14,"Short ton (US)":GL*2000,"Long ton (UK)":GL*2240};
konv($("#p1"),"Konversi Nomor Benang",Object.keys(NB),(v,a,b)=>fromTex(toTex(v,a),b),notesNB);
konv($("#p2"),"Konversi Satuan Panjang",Object.keys(PJ),(v,a,b)=>v*PJ[a]/PJ[b]);
konv($("#p3"),"Konversi Satuan Berat",Object.keys(BR),(v,a,b)=>v*BR[a]/BR[b]);

/* ---------- Tab ---------- */
const TT=["Produksi","Nomor Benang","Panjang","Berat"];
TT.forEach((t,i)=>{
  const b=document.createElement("button");b.textContent=t;
  b.onclick=()=>{document.querySelectorAll("nav button").forEach((x,k)=>x.classList.toggle("on",k===i));
    document.querySelectorAll("section").forEach((s,k)=>s.classList.toggle("on",k===i))};
  $("#tabs").appendChild(b);
});
$("#tabs button").click();
</script>
</body>
</html>
